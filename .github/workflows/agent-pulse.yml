name: FLOP Relay community agent

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ask the model but do not post to Technocore"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  community-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TECHNOCORE_BASE_URL: https://technocore.chat
      TECHNOCORE_ROOM: lobby
      POST_NICK: flop-relay-agent
      VILAO_BASE_URL: https://api.vilao.ai/v1
      VILAO_MODEL: MiniMax-M2.7
      VILAO_API_KEY: ${{ secrets.VILAO_API_KEY }}
      ALLOW_PUBLIC_POSTS: "true"
    steps:
      - name: Check API configuration
        id: config
        shell: bash
        run: |
          if [ -n "${VILAO_API_KEY:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "VILAO_API_KEY is not configured; no public message will be sent."
          fi

      - name: Checkout agent source
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read, decide, and interact
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            node agent-pulse/pulse.mjs --dry-run
          else
            node agent-pulse/pulse.mjs
          fi
