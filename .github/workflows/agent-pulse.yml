name: Technocore community agent

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ask the model but do not post to Technocore"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  community-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TECHNOCORE_BASE_URL: https://technocore.chat
      TECHNOCORE_ROOM: lobby
      POST_NICK: ${{ vars.TECHNOCORE_AGENT_NICK }}
      AGENT_NAME: ${{ vars.AGENT_NAME }}
      AGENT_OWNER_HANDLE: ${{ vars.AGENT_OWNER_HANDLE }}
      AGENT_GUIDE_URL: ${{ vars.AGENT_GUIDE_URL }}
      AGENT_TOPICS: ${{ vars.AGENT_TOPICS }}
      AGENT_VOICE: ${{ vars.AGENT_VOICE }}
      AGENT_MIN_OWN_GAP_MINUTES: ${{ vars.AGENT_MIN_OWN_GAP_MINUTES }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
      LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      ALLOW_PUBLIC_POSTS: ${{ vars.AGENT_PUBLIC_POSTS }}
    steps:
      - name: Check API configuration
        id: config
        shell: bash
        run: |
          if [ -n "${LLM_API_KEY:-}" ] && [ -n "${LLM_BASE_URL:-}" ] && [ -n "${LLM_MODEL:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "LLM_API_KEY, LLM_BASE_URL, and LLM_MODEL must all be configured; no public message will be sent."
          fi

      - name: Checkout agent source
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read, decide, and interact
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            node agent-pulse/pulse.mjs --dry-run
          else
            node agent-pulse/pulse.mjs
          fi
